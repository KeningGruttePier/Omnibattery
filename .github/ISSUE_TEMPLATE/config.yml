blank_issues_enabled: false
contact_links:
  - name: "🔋 New battery support"
    url: https://github.com/ffunes/Omnibattery/discussions/new?category=battery-requests
    about: Request support for a new battery brand or model through Discussions.
  - name: "🆘 Help with setup or configuration"
    url: https://github.com/ffunes/Omnibattery/discussions/new?category=q-a
    about: >
      Questions about installing, configuring, or using the integration belong in
      GitHub Discussions. Please do not open a bug report unless you can describe
      an unexpected behavior after completing the setup.
  - name: 💡 General Feature Request / Idea
    url: https://github.com/ffunes/Omnibattery/discussions/new?category=feature-ideas
    about: >
      General ideas go through community voting in Discussions. To request support
      for a new battery model, use the Battery Support link above instead.
